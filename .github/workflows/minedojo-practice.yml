name: MineDojo practice

on:
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "tests/**"
      - ".github/workflows/minedojo-practice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  woodcraft:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the PR revision
        uses: actions/checkout@v4

      - name: Prepare the official practice package with this branch's agent
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import shutil
          import zipfile
          from pathlib import Path

          source = Path("比赛资料库/02_比赛信息整理/官方资料存档/下载/赛道B_智能体开发包.zip")
          target = Path("practice-package")
          target.mkdir()
          with zipfile.ZipFile(source) as archive:
              for entry in archive.infolist():
                  path = Path(entry.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise RuntimeError(f"unsafe package path: {entry.filename}")
              archive.extractall(target)

          for name in ("agent.py", "action_items.json", "config.json", "minecraft_actions.py",
                       "model_api.py", "planner.py", "vision.py"):
              shutil.copy2(Path("agent") / name, target / name)
          config_path = target / "config.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["model"] = {"name": "offline", "api_url": "", "api_key": ""}
          config_path.write_text(json.dumps(config), encoding="utf-8")
          PY
          python3 practice-package/pack_agent.py --policy offline --output agent.zip \
            --extra planner.py vision.py

      - name: Run woodcraft against the official Docker environment
        shell: bash
        run: |
          docker pull --platform linux/amd64 docker.io/streetartist/uestc-minecraft-controller
          docker run --rm --init --platform linux/amd64 --cpus 4 --memory 4g --memory-swap 4g \
            --pids-limit 512 --shm-size 512m --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" --workdir /tmp \
            -e PYTHONPATH=/workspace/practice-package -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint xvfb-run docker.io/streetartist/uestc-minecraft-controller \
            -a python3 -u /workspace/practice-package/practice.py \
            --package /workspace/agent.zip \
            --scenes /workspace/practice-package/practice-scenes.json \
            --output /workspace/practice-output --only woodcraft --no-video
          sudo chown -R "$(id -u):$(id -g)" practice-output
          python3 - <<'PY'
          import json
          from pathlib import Path

          for result in Path("practice-output").glob("world-*/result.json"):
              data = json.loads(result.read_text(encoding="utf-8"))
              print("PRACTICE_SUMMARY", json.dumps(data.get("summary"), ensure_ascii=False))
              for episode in data.get("episodes", []):
                  print("PRACTICE_EPISODE", json.dumps({
                      "status": episode.get("status"),
                      "termination": episode.get("termination"),
                      "metrics": episode.get("metrics"),
                      "objectives": episode.get("objectives"),
                  }, ensure_ascii=False))
                  if (episode.get("termination") != "tutorial_goals" or
                          not episode.get("metrics", {}).get("task_success")):
                      raise SystemExit("MineDojo woodcraft objectives were not completed")
          PY

      - name: Upload world, trace, and agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minedojo-woodcraft-${{ github.run_id }}
          path: practice-output/
          if-no-files-found: warn
          retention-days: 14
